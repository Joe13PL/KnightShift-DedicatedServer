[Server]
; Dedicated RPG server (prototype). The game hosts an RPG session by
; itself, starts it when the players are ready, and the server's own player
; then becomes an observer. Run it on a separate PC / VPS with a Steam account
; that owns the game; players join it like any other session.
; KnightShift.ex1 only (engine type D3D8 classic). Scroll Lock pauses it.
Enabled=1
SessionName=KnightShift RPG Server
Password=
; Level name as listed in the host lobby (empty = first in the list).
Level=
; Players (besides the server) needed, and seconds all must stay ready.
MinPlayers=1
StartDelay=20
; Let players join the running game.
DynamicConnect=1
; The server's player becomes an observer ObserverDelay seconds after the start.
Observer=1
ObserverDelay=10
; Frame cap of the server (0 = game default) - saves CPU / GPU.
Fps=10
; Host a new session after a game ends.
AutoRestart=1
; When the game ends or the last player leaves, end it after EndDelay seconds
; (confirming the "game over" message) and go back to hosting.
EndDelay=5
; Player profile and RPG hero of the server, created automatically if missing
; (Players\<ProfileName>). A session cannot start without a hero.
ProfileName=Serwer
HeroName=Serwer
; CD key, entered only if the game asks for it (first start on a new machine,
; e.g. a VPS). Steam -> KnightShift -> Manage -> CD keys. Never shared.
CdKey=
; Give the server its own identity, so players with the same CD key as the
; server (e.g. its owner) can still join instead of "invalid serial number".
UniqueIdentity=1
; Server console: where the live log and commands (help, status, start, end,
; pause, resume, show, hide, quit) appear. Ctrl+C stops the server cleanly.
;   auto   = terminal if started from one (Linux/Wine), else a window (Windows)
;   stdio  = the terminal that started it (Linux VPS)
;   window = a separate console window (Windows)
;   off    = no console, only ksnetfix.log
Console=auto
; Game window: hidden (only the console is visible; "show" in the console
; displays it), minimized (on the taskbar after start-up), normal. In every
; mode the server keeps running without the focus and never steals it.
Window=hidden
; No sound on the server.
Mute=1
; Graphics: startup = draw only until the first menu (the game needs it to
; start), then nothing - minimal GPU / CPU use; always = keep drawing.
; "show" in the console draws again while the window is visible.
Render=startup

; ---------------------------------------------------------------------------
; Steam over the Internet (optional, experimental). Put these in the [Steam]
; section (not here) to run the server as an ANONYMOUS Steam game server -
; players join over Steam (SDR relays, no ports) without a Steam client or
; account on the server, and you can play on your own server on one PC.
;   [Steam]
;   Enabled=1
;   GameServer=1
;   AppId=254060
; The server prints its SteamID64 in the console/log ("players join by
; entering this SteamID..."). Players pick TCP/IP and type that SteamID64 in
; the address field. Start the server BEFORE the game client on the same PC.
; Leave [Steam] Enabled=0 for LAN / Radmin / ZeroTier (no Steam).
